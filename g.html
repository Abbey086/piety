<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="350" height="350">
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#ffffff" stroke="#b0b0b0" stroke-width="2"/>
  
  <!-- Eyes -->
  <ellipse cx="80" cy="100" rx="12" ry="12" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <ellipse cx="120" cy="100" ry="12" rx="12" fill="#ffffff" stroke="#000" stroke-width="1"/>
  
  <!-- Pupils -->
  <circle cx="80" cy="100" r="6" fill="#000"/>
  <circle cx="120" cy="100" r="6" fill="#000"/>
  
  <!-- Beak -->
  <polygon points="95,120 105,120 100,130" fill="#f4a261"/>
  

  <!-- Wings -->
  <path d="M53,140 Q0,90 53,100" fill="#ffffff" stroke="#b0b0b0" stroke-width="2"/>
  <path d="M147,140 Q200,90 146,100" fill="#ffffff" stroke="#b0b0b0" stroke-width="2"/>
  
  <!-- Feet -->
  <ellipse cx="80" cy="186" rx="8" ry="4" fill="#f4a261"/>
  <ellipse cx="120" cy="186" rx="8" ry="4" fill="#f4a261"/>

</svg>
</body>
