<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Habit Tracker</title>
  <script src="3.4.17.js"></script>
  <style>
    /* Custom CSS */
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f5f7fa;
      color: #333;
    }
    
    /* Screen containers */
    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 20px;
      background-color: white;
      overflow-y: auto;
      transition: transform 0.3s ease;
      z-index: 10;
    }
    
    .screen.active {
      transform: translateX(0);
    }
    
    .screen.inactive {
      transform: translateX(100%);
    }
    
    /* Progress bar */
    .progress-container {
      height: 12px;
      border-radius: 6px;
      background-color: #e0e0e0;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #4f46e5);
      transition: width 0.5s ease;
    }
    
    /* Date selector */
    .date-selector {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 16px 8px;
      -webkit-overflow-scrolling: touch;
    }
    
    .date-box {
      flex: 0 0 auto;
      width: 56px;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .date-box.active {
      background-color: #4f46e5;
      color: white;
    }
    
    .date-box:hover:not(.active) {
      background-color: #f0f0f0;
    }
    
    .day-name {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .day-number {
      font-size: 16px;
      font-weight: 700;
    }
    
    /* Habit card */
    .habit-card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 16px;
      margin-bottom: 16px;
      transition: transform 0.2s ease;
    }
    
    .habit-card:hover {
      transform: translateY(-2px);
    }
    
    /* Buttons */
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    
    .btn-primary {
      background-color: #222;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #222;
    }
    
    .btn-danger {
      background-color: #ef4444;
      color: white;
    }
    
    .btn-danger:hover {
      background-color: #dc2626;
    }
    
    .btn-secondary {
      background-color: #e0e0e0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background-color: #d0d0d0;
    }
    
    /* Inputs */
    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-bottom: 12px;
      font-size: 16px;
    }
    
    .input-field:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }
    
    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .app-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    /* Navigation buttons */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #f0f0f0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .nav-btn:hover {
      background-color: #e0e0e0;
    }
    
    /* Stats */
    .stats-card {
      background-color: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .stats-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .stats-value {
      font-size: 24px;
      font-weight: 700;
    }
    
    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Main Screen -->
  <div id="main-screen" class="screen active">
    <div class="app-header">
      <h1 class="app-title">Habit Tracker</h1>
      <div class="nav-btn" onclick="showScreen('add-screen')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
    </div>
    
    <div class="date-selector" id="date-selector"></div>
    
    <div id="habits-container" class="fade-in"></div>
    
    <div class="stats-card hidden">
      <div class="stats-title">Completion Rate</div>
      <div class="stats-value" id="completion-rate">0%</div>
    </div>
    
    <div class="stats-card hidden">
      <div class="stats-title">Current Streak</div>
      <div class="stats-value" id="current-streak">0 days</div>
    </div>
  </div>
  
  <!-- Add Habit Screen -->
  <div id="add-screen" class="screen inactive">
    <div class="app-header">
      <div class="nav-btn" onclick="showScreen('main-screen')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </div>
      <h1 class="app-title">Add New Habit</h1>
      <div style="width: 40px;"></div> <!-- Spacer for alignment -->
    </div>
    
    <form id="add-habit-form">
      <input type="text" class="input-field" id="habit-name" placeholder="Habit name (e.g., Drink Water)" required>
      
      <select class="input-field" id="habit-period" required>
        <option value="" disabled selected>Select period</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      
      <input type="number" class="input-field" id="habit-frequency" placeholder="Frequency (e.g., 8)" min="1" required>
      
      <button type="button" class="btn btn-primary" style="width: 100%;" onclick="addHabit()">Add Habit</button>
    </form>
  </div>
  
  <!-- Edit Habit Screen -->
  <div id="edit-screen" class="screen inactive">
    <div class="app-header">
      <div class="nav-btn" onclick="showScreen('main-screen')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </div>
      <h1 class="app-title">Edit Habit</h1>
      <div style="width: 40px;"></div> <!-- Spacer for alignment -->
    </div>
    
    <form id="edit-habit-form">
      <input type="text" class="input-field" id="edit-habit-name" placeholder="Habit name" required>
      
      <select class="input-field" id="edit-habit-period" required>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      
      <input type="number" class="input-field" id="edit-habit-frequency" placeholder="Frequency" min="1" required>
      
      <button type="button" class="btn btn-primary" style="width: 100%;" onclick="updateHabit()">Save Changes</button>
      <button type="button" class="btn btn-danger" style="width: 100%; margin-top: 8px;" onclick="confirmDelete()">Delete Habit</button>
    </form>
  </div>
  
  <!-- Confirmation Dialog -->
  <div id="confirm-dialog" class="" style="display: none;position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 20px;
      background-color: white;
      overflow-y: auto;
      transition: transform 0.3s ease; background-color: rgba(0,0,0,0.5); z-index: 2055555432222222;">
    <div style="background-color: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; margin: auto; margin-top: 50%;">
      <h2 style="font-size: 18px; margin-bottom: 20px; text-align: center;">Are you sure you want to delete this habit?</h2>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn btn-secondary" onclick="hideDialog()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteHabit()">Delete</button>
      </div>
    </div>
  </div>
  
  <script>
    // Global variables
    let habits = [];
    let currentSelectedDate = getToday();
    let currentlyEditingHabitId = null;
    
    // Initialize the app
    document.addEventListener('DOMContentLoaded', function() {
      // Load habits from localStorage
      loadHabits();
      
      // Initialize date selector
      initDateSelector();
      
      // Display today's habits
      renderHabits();
      
      // Calculate and display stats
      updateStats();
    });
    
    // Helper functions
    function getToday() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }
    
    function getDateKey(dateStr) {
      const date = new Date(dateStr);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // Screen management
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
        screen.classList.add('inactive');
      });
      
      document.getElementById(screenId).classList.remove('inactive');
      document.getElementById(screenId).classList.add('active');
    }
    
    function hideDialog() {
      document.getElementById('confirm-dialog').style.display = 'none';
    }
    
    // Date selector functions
    function initDateSelector() {
      const container = document.getElementById('date-selector');
      container.innerHTML = '';
      
      // Create 30 days worth of date boxes (today + 29 days back)
      for (let i = 29; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        
        const dateKey = getDateKey(date);
        const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
        const dayNumber = date.getDate();
        
        const dateBox = document.createElement('div');
        dateBox.className = `date-box${dateKey === currentSelectedDate ? ' active' : ''}`;
        dateBox.innerHTML = `
          <div class="day-name">${dayName}</div>
          <div class="day-number">${dayNumber}</div>
        `;
        
        dateBox.addEventListener('click', () => {
          currentSelectedDate = dateKey;
          initDateSelector();
          renderHabits();
          updateStats();
        });
        
        container.appendChild(dateBox);
      }
    }
    
    // Habit management functions
    function loadHabits() {
      const savedHabits = localStorage.getItem('habits');
      habits = savedHabits ? JSON.parse(savedHabits) : [];
    }
    
    function saveHabits() {
      localStorage.setItem('habits', JSON.stringify(habits));
    }
    
    function addHabit() {
      const name = document.getElementById('habit-name').value.trim();
      const period = document.getElementById('habit-period').value;
      const frequency = parseInt(document.getElementById('habit-frequency').value);
      
      if (!name || !period || isNaN(frequency) || frequency <= 0) {
        alert('Please fill all fields with valid values');
        return;
      }
      
      const newHabit = {
        id: Date.now().toString(),
        name,
        period,
        frequency,
        completions: {},
        createdAt: new Date().toISOString()
      };
      
      habits.push(newHabit);
      saveHabits();
      
      // Clear form
      document.getElementById('add-habit-form').reset();
      
      // Show main screen and refresh
      showScreen('main-screen');
      renderHabits();
      updateStats();
    }
    
    function renderHabits() {
      const container = document.getElementById('habits-container');
      container.innerHTML = '';
      
      if (habits.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666; margin-top: 40px;">No habits yet. Add one to get started!</p>';
        return;
      }
      
      habits.forEach(habit => {
        // Initialize completion for this date if it doesn't exist
        if (!habit.completions[currentSelectedDate]) {
          habit.completions[currentSelectedDate] = 0;
          saveHabits();
        }
        
        const completed = habit.completions[currentSelectedDate];
        const percentComplete = Math.min(100, (completed / habit.frequency) * 100);
        
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <h3 style="font-size: 18px; font-weight: 600;">${habit.name}</h3>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="editHabit('${habit.id}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
              </button>
            </div>
          </div>
          <p style="color: #666; margin-bottom: 8px; font-size: 14px;">
            ${habit.period.charAt(0).toUpperCase() + habit.period.slice(1)}: ${completed} of ${habit.frequency}
          </p>
          <div class="progress-container" style="margin-bottom: 8px;">
            <div class="progress-bar" style="width: ${percentComplete}%"></div>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <button class="btn btn-secondary" onclick="decrementHabit('${habit.id}')" style="flex: 1; margin-right: 8px;" ${completed <= 0 ? 'disabled' : ''}>-</button>
            <button class="btn btn-primary" onclick="incrementHabit('${habit.id}')" style="flex: 1;">+</button>
          </div>
        `;
        
        container.appendChild(card);
      });
    }
    
    function incrementHabit(habitId) {
      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;
      
      // Initialize completion for this date if it doesn't exist
      if (!habit.completions[currentSelectedDate]) {
        habit.completions[currentSelectedDate] = 0;
      }
      
      // Only increment if we haven't reached the frequency goal
     // if (habit.completions[currentSelectedDate] < habit.frequency) {
        habit.completions[currentSelectedDate]++;
        saveHabits();
        renderHabits();
        updateStats();
      //}
    }
    
    function decrementHabit(habitId) {
      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;
      
      // Decrement only if we're above 0
      if (habit.completions[currentSelectedDate] > 0) {
        habit.completions[currentSelectedDate]--;
        saveHabits();
        renderHabits();
        updateStats();
      }
    }
    
    function editHabit(habitId) {
      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;
      
      currentlyEditingHabitId = habitId;
      
      document.getElementById('edit-habit-name').value = habit.name;
      document.getElementById('edit-habit-period').value = habit.period;
      document.getElementById('edit-habit-frequency').value = habit.frequency;
      
      showScreen('edit-screen');
    }
    
    function updateHabit() {
      const habit = habits.find(h => h.id === currentlyEditingHabitId);
      if (!habit) {
        showScreen('main-screen');
        return;
      }
      
      const newName = document.getElementById('edit-habit-name').value.trim();
      const newPeriod = document.getElementById('edit-habit-period').value;
      const newFrequency = parseInt(document.getElementById('edit-habit-frequency').value);
      
      if (!newName || !newPeriod || isNaN(newFrequency) || newFrequency <= 0) {
        alert('Please fill all fields with valid values');
        return;
      }
      
      habit.name = newName;
      habit.period = newPeriod;
      
      // If frequency changes, we need to adjust completions if they exceed new frequency
      if (habit.frequency !== newFrequency) {
        habit.frequency = newFrequency;
        
        // Cap all completions at new frequency
        for (const date in habit.completions) {
          habit.completions[date] = Math.min(newFrequency, habit.completions[date]);
        }
      }
      
      saveHabits();
      showScreen('main-screen');
      renderHabits();
      updateStats();
    }
    
    function confirmDelete() {
      document.getElementById('confirm-dialog').style.display = 'block';
    }
    
    function deleteHabit() {
      habits = habits.filter(h => h.id !== currentlyEditingHabitId);
      saveHabits();
      hideDialog();
      showScreen('main-screen');
      renderHabits();
      updateStats();
    }
    
    // Stats functions
    function updateStats() {
      // Calculate completion rate
      let completedHabits = 0;
      habits.forEach(habit => {
        if (habit.completions[currentSelectedDate] >= habit.frequency) {
          completedHabits++;
        }
      });
      
      const completionRate = habits.length > 0 
        ? Math.round((completedHabits / habits.length) * 100) 
        : 0;
        
      document.getElementById('completion-rate').textContent = `${completionRate}%`;
      
      // Calculate current streak (simplified)
      const streak = calculateStreak();
      document.getElementById('current-streak').textContent = `${streak} ${streak === 1 ? 'day' : 'days'}`;
    }
    
    function calculateStreak() {
      // Simplified streak calculation - in a real app this would be more comprehensive
      let streak = 0;
      
      // Check for today first
      let date = new Date(currentSelectedDate);
      date.setDate(date.getDate() - streak);
      
      while (true) {
        const dateKey = getDateKey(date);
        const allHabitsCompleted = habits.every(habit => {
          return habit.completions[dateKey] >= habit.frequency;
        });
        
        if (!allHabitsCompleted || streak >= 30) {
          break;
        }
        
        streak++;
        date.setDate(date.getDate() - 1);
      }
      
      return streak;
    }
    
    // Function to handle window resize (for responsive adjustments)
    window.addEventListener('resize', function() {
      // You can add responsive adjustments here if needed
    });
  </script>
</body>
</html>
