<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verse to Image Generator</title>

<!-- Google Fonts (10 fonts) -->
<link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display&family=Indie+Flower&family=Lobster&family=Montserrat&family=Pacifico&family=Open+Sans&family=Raleway&family=Merriweather&family=Oswald&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
.verser  #verse-container {
    width: 360px;
    height: 360px;
    margin: auto;
    padding: 30px;
    color: white;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-sizing: border-box;
    user-select: none;
  }
.verser .cp{
  position: absolute;
  bottom:15px;
}
.verser  #verse-text {
    font-size: 1.5rem;
    line-height: 1.4;
    max-width: 90%;
  }

.verser  #verse-ref {
    margin-top: 20px;
    font-weight: 700;
    font-size: 1.25rem;
    opacity: 0.85;
  }
  .bg-1 { background-image:url("river.jpg");
  background-size: 100%;
  background-position: center;
  }
  .bg-2 { background: linear-gradient(135deg, #ff9a9e, #fad0c4); color: #333; }
  .bg-3 { background: linear-gradient(45deg, #00c6ff, #0072ff); }
  .bg-4 { background: linear-gradient(60deg, #29323c, #485563); }
  .bg-5 { background: linear-gradient(45deg, #56ab2f, #a8e063); }
  .bg-6 { background-image:url("drizzling.jpg");
  background-size: 100%;
  background-position: center;

  }
    .bg-7 { background-image:url("grass.jpg");
  background-size: 100%;
  background-position: center;
  }
  .bg-8 { background: linear-gradient(45deg, #fc5c7d, #6a82fb); }
  .bg-9 { background: radial-gradient(circle at center, #f9d423 0%, #ff4e50 100%); }
  .bg-10 { background: linear-gradient(45deg, #2c3e50, #4ca1af); }

 .verser button {
    margin: 10px 8px;
    padding: 8px 14px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
    cursor: pointer;
  }
  .verser  select {
    margin: 3px;
    padding: 6px 3px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
    cursor: pointer;
    width:30%;
  }

</style>
</head>
<body>

  <h1>Save verse as an image</h1>

  <textarea id="verse-input" rows="4" cols="40" style="display: none;" placeholder="Type your verse here...">For God so loved the world that He gave His only begotten Son...</textarea>
  <input id="ref-input" type="text" placeholder="Reference (e.g. John 3:16)" value="John 3:16" style="width: 250px; padding: 8px; font-size: 1rem; margin: 10px auto; display: none; border-radius: 6px; border: 1px solid #ccc;" />

  <div id="verse-container" class="bg-1" style="font-family: 'Roboto', sans-serif;">
    <div id="verse-text">For God so loved the world that He gave His only begotten Son...</div>
    <div id="verse-ref">John 3:16</div>
    <div class="cp">Made from Piety Life App</div>
  </div>
  <div style="text-align: left;">
    <label for="font-select">Font:</label>
    <select id="font-select" aria-label="Choose font">
      <option value="Roboto">Roboto</option>
      <option value="Playfair Display">Playfair Display</option>
      <option value="Indie Flower">Indie Flower</option>
      <option value="Lobster">Lobster</option>
      <option value="Montserrat">Montserrat</option>
      <option value="Pacifico">Pacifico</option>
      <option value="Open Sans">Open Sans</option>
      <option value="Raleway">Raleway</option>
      <option value="Merriweather">Merriweather</option>
      <option value="Oswald">Oswald</option>
    </select>

    <label for="background-select">Background:</label>
    <select id="background-select" aria-label="Choose background">
      <option value="bg-1">River</option>
      <option value="bg-2">Pink Pastel</option>
      <option value="bg-3">Blue Sky</option>
      <option value="bg-4">Dark Steel</option>
      <option value="bg-5">Green Fresh</option>
      <option value="bg-6">Drizzling</option>
      <option value="bg-7">Grass</option>
      <option value="bg-8">Pink Purple</option>
      <option value="bg-9">Yellow Red</option>
      <option value="bg-10">Teal Blue</option>
    </select>
  </div>

  <button onclick="downloadAsImage()">Download as JPG</button>
  <button onclick="shareVerseImage()">Share as JPG</button>

</body>
</html>
