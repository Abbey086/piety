<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Note</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #111;
      line-height: 1.4;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      z-index: 10;
    }

    header button {
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #e5e5ea;
      cursor: pointer;
    }

    main {
      padding: 16px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .meta {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .content {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .content h1, .content h2, .content h3 {
      margin: 12px 0 8px;
    }

    .content p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <header>
    <button onclick="window.location.href='../../index.html'">← Back</button>
    <h2>Note</h2>
  </header>

  <main>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="content" id="content"></div>
  </main>

  <script>
    function getNotes() {
      return JSON.parse(localStorage.getItem("iosNotes")) || {};
    }

    // Parse Quill JSON delta into HTML
    function renderQuillContent(deltaString) {
      try {
        const delta = JSON.parse(deltaString);
        let html = "";
        delta.ops.forEach(op => {
          if (op.insert) {
            if (op.attributes && op.attributes.header) {
              html += `<h${op.attributes.header}>${op.insert.replace(/\n/g,"")}</h${op.attributes.header}>`;
            } else {
              html += `<p>${op.insert.replace(/\n/g,"<br>")}</p>`;
            }
          }
        });
        return html;
      } catch (e) {
        return `<p>${deltaString}</p>`; // fallback
      }
    }

    function loadNote() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("i");
      const notes = getNotes();
      const note = notes[id];
      if (!note) {
        document.getElementById("title").innerText = "Note not found";
        return;
      }

      document.getElementById("title").innerText = note.title;
      document.getElementById("meta").innerText =
        `By ${note.preacher} • ${new Date(note.date).toLocaleDateString()} • ${note.location}`;
      document.getElementById("content").innerHTML = renderQuillContent(note.content);
    }

    loadNote();
  </script>
</body>
</html>
