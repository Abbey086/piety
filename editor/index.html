<!DOCTYPE html>
<html lang="en" ng-app="App" ng-controller="QuillController">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Note</title>
  <link rel="stylesheet" href="assets/quill.snow.css">
  <script src="assets/angular.min.js"></script>
  <script src="assets/quill.min.js"></script>
  <style>
    :root {
      --ios-blue: #007AFF;
      --ios-gray: #F2F2F7;
      --ios-separator: #C6C6C8;
      --ios-red: #FF3B30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--ios-gray);
      height: 100vh;
      overflow: hidden;
    }

    /* Fullscreen overlay for metadata form */
    .form-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .form-screen header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--ios-separator);
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .form-screen main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .ios-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--ios-separator);
      border-radius: 8px;
      font-size: 16px;
      background: var(--ios-gray);
    }

    .ios-button {
      width: 100%;
      padding: 14px;
      background: var(--ios-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
    }

    .error-text {
      color: var(--ios-red);
      text-align: center;
      margin-bottom: 12px;
    }

    /* Editor screen */
    .editor-screen {
      height: 0vh;
      display: flex;
      flex-direction: column;
  
    }

    .editor-screen header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--ios-separator);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-screen header h1 {
      font-size: 17px;
      font-weight: 600;
    }

    .editor-screen header button {
      background: none;
      border: none;
      color: var(--ios-blue);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    #editor {
      flex: 1;
      min-height: 400px;
      border: none;
  
    }

    footer {
      border-top: 1px solid var(--ios-separator);
      background: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
    }

    footer button {
      background: none;
      border: none;
      color: var(--ios-blue);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Metadata screen -->
  <div class="form-screen" ng-if="showForm">
    <header>{{ noteId ? 'Edit Note Details' : 'New Note' }}</header>
    <main>
      <input type="text" class="ios-input" placeholder="Title" ng-model="note.title">
      <input type="text" class="ios-input" placeholder="Preacher" ng-model="note.preacher">
      <input type="text" class="ios-input" placeholder="Location" ng-model="note.location">
      <p class="error-text" ng-if="error">{{error}}</p>
      <button class="ios-button" ng-click="goToEditor()">Continue</button>
    </main>
  </div>

  <!-- Editor screen -->
  <div class="editor-screen" ng-if="!showForm">
    <header>
      <button ng-click="goToForm()">Details</button>
      <h1>Editor</h1>
      <button ng-click="saveNote()">Save</button>
    </header>
    <div id="editor"></div>
    
  </div>

  <script>
    angular.module('App', [])
      .controller('QuillController', ['$scope', function($scope) {
        $scope.note = {
          title: '',
          preacher: '',
          location: '',
          content: '',
          date: new Date(),
          isFav: false
        };
        $scope.error = '';
        $scope.quill = null;
        $scope.showForm = true;
        // Load existing notes
        const storedNotes = localStorage.getItem('iosNotes');
        $scope.notes = storedNotes ? JSON.parse(storedNotes) : {};

        // Check if editing existing note
        const urlParams = new URLSearchParams(window.location.search);
        $scope.noteId = urlParams.get('i');

        if ($scope.noteId && $scope.notes[$scope.noteId]) {
          $scope.note = $scope.notes[$scope.noteId];
        }

        function initQuill() {
          if (!$scope.quill) {
            $scope.quill = new Quill('#editor', {
              theme: 'snow',
              modules: {
                toolbar: [
                  ['bold', 'underline'],
                  ['blockquote'],
                  [{ 'header': 1 }, { 'header': 2 }],
                  [{ 'list': 'bullet' }]
                ]
              }
            });
            if ($scope.note.content) {
              try {
                $scope.quill.setContents(JSON.parse($scope.note.content));
              } catch {
                $scope.quill.root.innerHTML = $scope.note.content;
              }
            }
          }
        }

        // Go to editor (after validating form)
        $scope.goToEditor = function() {
          if (!$scope.note.title || !$scope.note.preacher || !$scope.note.location) {
            $scope.error = 'Please fill all fields';
            return;
          }
          $scope.error = '';
          $scope.showForm = false;
          setTimeout(initQuill, 0);
          
        };

        // Go back to form
        $scope.goToForm = function() {
          $scope.showForm = true;
        };

        // Save note
        $scope.saveNote = function() {
          $scope.note.date = new Date();
          if ($scope.quill) {
$scope.note.content = $scope.quill.root.innerHTML;          }

          const id = $scope.noteId || Date.now().toString();
          $scope.notes[id] = angular.copy($scope.note);
          localStorage.setItem('iosNotes', JSON.stringify($scope.notes));

          if (!$scope.noteId) {
            window.history.replaceState({}, '', `?i=${id}`);
            $scope.noteId = id;
          }

          alert('Note saved successfully!');
        };

        // Clear note content
        $scope.clearNote = function() {
          if (confirm('Clear this note?')) {
            $scope.quill.setContents([]);
            $scope.note.content = '';
          }
        };
      }]);
      document.querySelector('div.ql-editor')
      function back(){
        if(confirm("Are you sure you want to leave this page. Make sure you have saved your data")){
          window.history.back()
        }
      }
  </script>
</body>
</html>
