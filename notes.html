<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    header {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 12px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ccc;
      z-index: 10;
    }
    header button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #ddd;
      cursor: pointer;
    }
    header button.active {
      background: #4caf50;
      color: white;
    }
    .note {
      background: var(--bg);
      border-radius: 12px;
      padding: 6px;
      border: solid 1px var(--b);
      margin: 12px;
    }
    .note h3 {
      margin: 0;
      padding: 16px 0;
      font-size: 1.55rem;
    }
    .note p {
      font-size: 1rem;
      padding: 3px 0;
      margin: 0;
      color: #455;
    }
  </style>
</head>
<body>

  <header>
    <button id="allBtn">All</button>
    <button id="favBtn">Favorites</button>
  </header>

  <main></main>

  <script>
    const main = document.querySelector('main');
    const allBtn = document.getElementById('allBtn');
    const favBtn = document.getElementById('favBtn');

    function getTab() {
      const params = new URLSearchParams(window.location.search);
      return params.get('tab') || 'all';
    }

    function setTab(tab) {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tab);
      window.location.href = url.toString();
    }

    function read() {
      const currentTab = getTab();
      allBtn.classList.toggle('active', currentTab === 'all');
      favBtn.classList.toggle('active', currentTab === 'fav');

      main.innerHTML = '';

      var data = JSON.parse(localStorage.getItem("iosNotes"))
    var id = 1755856955519
      var noteObject = data[id]
            const template = `
              <div class="note" onclick="window.location.href='editor/assets/viewer.html?i=${id}'" style="--bg:${noteObject.isFav ? '#ffe' : '#efe'};--b:${noteObject.isFav ? '#aa6' : '#6f6'}">
                <h3>${noteObject.title}</h3>
                <p>By ${noteObject.preacher}</p>
                <p>${noteObject.date} • ${noteObject.location}</p>
                <p>
                  <button type="button" onclick="event.stopPropagation(); window.location.href='editor/index.html?i=${id}'">Edit</button>
                  <button type="button" onclick="event.stopPropagation(); toggleFavourite(${id})">${noteObject.isFav ? 'Unfavourite' : 'Favourite'}</button>
                  <button type="button" onclick="event.stopPropagation(); dlt(${id})">Delete</button>
                </p>
              </div>`;
            
            main.innerHTML += template;
    }
    function toggleFavourite(index) {
      let notes = JSON.parse(localStorage.getItem('iosNotes'))
      console.log(index)
      let note = notes[index];
      note.isFav = !note.isFav;
      localStorage.setItem("iosNotes", JSON.stringify(note));
      read();
    }

    function dlt(index) {
      const key = 'note' + index;
      let note = JSON.parse(localStorage.getItem(key));
      note.alive = 'deleted';
      localStorage.setItem(key, JSON.stringify(note));
      read();
    }

    allBtn.onclick = () => setTab('all');
    favBtn.onclick = () => setTab('fav');

    read();
  </script>

</body>
</html>
