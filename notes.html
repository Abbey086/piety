<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #111;
      line-height: 1.4;
    }

    header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      z-index: 10;
    }

    header button {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      font-size: 0.95rem;
      background: #e5e5ea;
      cursor: pointer;
      transition: background 0.2s;
    }

    header button.active {
      background: #007aff;
      color: white;
    }

    main {
      padding: 8px;
    }

    .note {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: transform 0.1s ease-in-out;
    }

    .note:active {
      transform: scale(0.98);
    }

    .note h3 {
      margin-bottom: 6px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #111;
    }

    .note p {
      margin: 4px 0;
      font-size: 0.95rem;
      color: #555;
    }

    .note-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .note-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.85rem;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      cursor: pointer;
      transition: background 0.2s;
    }

    .note-actions button:hover {
      background: #e5e5ea;
    }

    .note-actions button.primary {
      background: #007aff;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <button id="allBtn">All</button>
    <button id="favBtn">Favorites</button>
  </header>
  <main></main>

  <script>
    const main = document.querySelector('main');
    const allBtn = document.getElementById('allBtn');
    const favBtn = document.getElementById('favBtn');

    function getTab() {
      const params = new URLSearchParams(window.location.search);
      return params.get('tab') || 'all';
    }

    function setTab(tab) {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tab);
      window.location.href = url.toString();
    }

    function getNotes() {
      return JSON.parse(localStorage.getItem("iosNotes")) || {};
    }

    function saveNotes(notes) {
      localStorage.setItem("iosNotes", JSON.stringify(notes));
    }

    function read() {
      const currentTab = getTab();
      allBtn.classList.toggle('active', currentTab === 'all');
      favBtn.classList.toggle('active', currentTab === 'fav');

      main.innerHTML = '';
      const data = getNotes();
console.log(data)
      Object.keys(data).forEach(id => {
        const note = data[id];
        if (currentTab === "fav" && !note.isFav) return;

        const template = `
          <div class="note" onclick="window.location.href='editor/assets/viewer.html?i=${id}'">
            <h3>${note.title}</h3>
            <p>By ${note.preacher}</p>
            <p>${new Date(note.date).toLocaleDateString()} • ${note.location}</p>
            <div class="note-actions">
              <button type="button" onclick="event.stopPropagation(); window.location.href='editor/index.html?i=${id}'">Edit</button>
              <button type="button" class="primary" onclick="event.stopPropagation(); toggleFavourite(${id})">${note.isFav ? 'Unfavourite' : 'Favourite'}</button>
              <button type="button" onclick="event.stopPropagation(); dlt(${id})">Delete</button>
            </div>
          </div>`;

        main.innerHTML += template;
      });
    }

    function toggleFavourite(id) {
      const notes = getNotes();
      if (!notes[id]) return;
      notes[id].isFav = !notes[id].isFav;
      saveNotes(notes);
      read();
    }

    function dlt(id) {
      const notes = getNotes();
      delete notes[id];
      saveNotes(notes);
      read();
    }

    allBtn.onclick = () => setTab('all');
    favBtn.onclick = () => setTab('fav');

    // create dummy note if none exists
    if (!localStorage.getItem("iosNotes")) {
      const id = Date.now();
      const dummy = {
        title: "Welcome Note",
        preacher: "System",
        location: "Local",
        content: "Hello world",
        date: new Date().toISOString(),
        isFav: false
      };
      const notes = {};
      notes[id] = dummy;
      saveNotes(notes);
    }

    read();
  </script>
</body>
</html>
