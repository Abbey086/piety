<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <script type="text/javascript" src="apexcharts.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --primary: #2a72de;
      --accent: #ffd75e;
      --card-bg: #fff;
      --text: #333;
      --muted: #666;
      --radius: 14px;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 50px;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    header p {
      font-size: 0.9em;
      color: var(--muted);
    }

    header p span {
      display: block;
      font-weight: bold;
      font-size: 1.3em;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 0.85em;
      cursor: pointer;
      font-weight: 500;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-accent { background: var(--accent); color: #222; }

    .section {
      margin: 16px;
    }

    .section h2 {
      font-size: 1.2em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .notes-grid {
      display: grid;
      gap: 12px;
    }

    .note {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .note:hover {
      transform: translateY(-2px);
    }

    .note h3 {
      margin: 0 0 6px;
      font-size: 1.05em;
      color: var(--primary);
    }

    .note p {
      font-size: 0.85em;
      color: var(--muted);
      margin: 2px 0;
    }

    .empty-state {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      background: #fafafa;
      border-radius: var(--radius);
      font-size: 0.9em;
    }

    #chart {
      margin: 16px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
    }
    .nb{
      position: relative;
      top:0px;
            animation: bmc 1000ms ease-in-out;

    }
    .nb button {
      display: none;
    }
    @keyframes bmc{
      0%{
        top:0;
      }
      58%{
        top:-60px;
      }
      100%{
        top: 0;
}
    }
    .nb .message{
      display: inline;
      text-align: right;
      max-lines: 2;
      
      max-width: 70vw;
    }
    .message{display: none;text-align: right;max-width: 70vw;
}
  </style>
</head>
<body onload="message ('Have you backed up your data?')">

      <p class="message">that makes sense to have someone who just care</p>
    </div>
  </header>

  <div id="chart">
    <a href="backup.html" style="z-index: 1; position: relative; background: rgba(200, 200, 250);text-decoration:none; color: blue; padding: 7px 10px;border-radius: 22px;float: right; font-weight: normal;" class="ri-upload-line">   Back Up</a>
  </div>

  .apexcharts-canvas svg{
    position: absolute;

</style>

    <h2>Recent Notes<span style="float: right; color: dodgerblue;font-size: 16px;" onclick="window.location.href='notes.html'">View All</span></h2>

<script>
document.getElementById('nameD').innerHTML = JSON.parse(localStorage.getItem('user'))?.name || "Guest";

// ----- Graph -----
function getToday() {
  const today = new Date();
  return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
}

function graph(){
  const savedHabits = localStorage.getItem('habits');
  const habits = savedHabits ? JSON.parse(savedHabits) : [];
  let total = 0;
  for(let i=0;i<habits.length;i++){
    const p = habits[i].completions[getToday()] / habits[i].frequency;
    total+=p;
  }
  var averagePercentage = habits.length > 0 ? total*100/habits.length : 0;
 averagePercentage = averagePercentage?averagePercentage:0
  var options = {  
        series: [averagePercentage],  // Use the average percentage for the chart  
        chart: {  
            height: 260,  
            type: 'radialBar',  
            offsetY: 0  
        },  
        plotOptions: {  
            radialBar: {  
                startAngle: -135,  
                endAngle: 135,  
                dataLabels: {  
                    name: {  
                        fontSize: '12px',  
                        color: undefined,  
                        offsetY: 90  
                    },  
                    value: {  
                        offsetY: 46,  
                        fontSize: '34px',  
                        color: undefined,  
                        formatter: function (val) {  
                         setTimeout(()=>{ val.toFixed(0)==0?message("Remember to record your habit performance"):''},10000)
                            return val.toFixed(0) + "%";  // Display with 2 decimal places  
                        }  
                    }  
                }  
            }  
        },  
        fill: {  
            type: 'gradient',  
            gradient: {  
                shade: 'dark',  
                shadeIntensity: 0.15,  
                inverseColors: false,  
                opacityFrom: 1,  
                opacityTo: 1,  
                stops: [0, 50, 65, 91]  
            }  
        },  
        stroke: {  
            dashArray: 4  
        },  
        labels: ['Habit Performance Today'],  
    };  
  
    var chart = new ApexCharts(document.querySelector("#chart"), options);  
    chart.render();  
}
graph();

// ----- Notes Loader -----
function loadNotes() {
  let stored = JSON.parse(localStorage.getItem("iosNotes")) || {};
  let notes = Object.keys(stored).map(id => {
    let note = stored[id];
    note.id = id;
    return note;
  }).filter(n => n.alive !== 'deleted');

  notes.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Recent
  const recent = notes.slice(0,5);
  const recentContainer = document.getElementById('recentNotes');
  recentContainer.innerHTML = '';
  if (recent.length === 0) {
    recentContainer.innerHTML = `<div class="empty-state">No notes yet. Click "New Note" to create one.</div>`;
  } else {
    recent.forEach(note => recentContainer.innerHTML += renderNoteCard(note));
  }

  // Favorites
  const favs = notes.filter(n => n.isFav).slice(0,2);
  const favContainer = document.getElementById('favNotes');
  favContainer.innerHTML = '';
  if (favs.length === 0) {
    favContainer.innerHTML = `<div class="empty-state">No favorites yet. Mark some notes as favorite!</div>`;
  } else {
    favs.forEach(note => favContainer.innerHTML += renderNoteCard(note));
  }
}

function renderNoteCard(note) {
  return `
    <div class="note" onclick="window.location.href='editor/assets/viewer.html?i=${note.id}'">
      <h3>${note.title}</h3>
      <p>By ${note.preacher || "Unknown"}</p>
      <p>${note.date ? new Date(note.date).toLocaleDateString() : ""} • ${note.location || "No location"}</p>
    </div>`;
}

function backupData() {
 location.href='backup.html'}


function donate() {
 location.href='donate.html'}

function message(v=''){
  if(v.length != ''){
  var ha = document.querySelector('.header-actions')
  var messageEl = document.querySelector('.header-actions .message')
    var btns = document.querySelectorAll('.header-actions button')
messageEl.textContent=v
  ha.classList.add('nb')

  
  Object.keys(btns).map(key=>
    
    btns[key].style.display='inline'
  )
  messageEl.style.display='none'
  setTimeout(function (){
      messageEl.style.display='inline'
      Object.keys(btns).map(key=>
    
    btns[key].style.display='none'
)
  },500)
    
      setTimeout(function (){
        message()  },4000)

  }
  else{
  var ha = document.querySelector('.header-actions')
  var messageEl = document.querySelector('.header-actions .message')
    var btns = document.querySelectorAll('.header-actions button')
//messageEl.textContent=v
  ha.classList.remove('nb')
  ha.classList.add('nb')

  
  /*Object.keys(btns).map(key=>
    
    btns[key].style.display='inline'
  )
  messageEl.style.display='none'*/
  setTimeout(function (){
      messageEl.style.display='none'
      Object.keys(btns).map(key=>
    
    btns[key].style.display='inline'
)
  },500)}
    setTimeout(function (){

  ha.classList.remove('nb')
  },1000)
  

}
loadNotes();
</script>
