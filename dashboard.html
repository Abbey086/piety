 <script src="bible.js" type="text/javascript" charset="utf-8"></script>

 <script>
function generateVerseOfDay() {
  const today = new Date().toISOString().split('T')[0]; // e.g. "2025-07-22"
  const storedData = JSON.parse(localStorage.getItem("verseOfTheDay"));

  // If verse exists and it's for today, use it
  if (storedData && storedData.date === today) {
    displayVerseOfTheDay(storedData);
    return;
  }

  // Otherwise, generate a new verse
  const bookIndex = Math.floor(Math.random() * bible.length);
  const book = bible[bookIndex];
  const chapterIndex = Math.floor(Math.random() * book.chapters.length);
  const chapter = book.chapters[chapterIndex];
  const verseIndex = Math.floor(Math.random() * chapter.length);
  const verseText = chapter[verseIndex];
  const reference = `${book.name} ${chapterIndex + 1}:${verseIndex + 1}`;

  const newVerse = {
    date: today,
    reference: reference,
    text: verseText
  };

  localStorage.setItem("verseOfTheDay", JSON.stringify(newVerse));
  displayVerseOfTheDay(newVerse);
}

function displayVerseOfTheDay(verseObj) {
  document.getElementById("dailyVerse").innerHTML =
    `<strong>${verseObj.reference}</strong> — ${verseObj.text}`;
}

// Generate one when the page loads
generateVerseOfDay();
   
    
 </script>
   <script>
    const main = document.querySelector('article');
    const allBtn = document.getElementById('allBtn');
    const favBtn = document.getElementById('favBtn');

    function getTab() {
      const params = new URLSearchParams(window.location.search);
      return params.get('tab') || 'all';
    }

    function setTab(tab) {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tab);
      window.location.href = url.toString();
    }

    function read() {
      const currentTab = getTab();
      allBtn.classList.toggle('active', currentTab === 'all');
      favBtn.classList.toggle('active', currentTab === 'fav');

      main.innerHTML = '';

      for (let i = 1; i <= localStorage.length; i++) {
        const key = 'note' + i;
        const raw = localStorage.getItem(key);
        if (raw) {
          let noteObject = JSON.parse(raw);
          if (noteObject.alive !== 'deleted') {
            if (noteObject.favourite === undefined) noteObject.favourite = false;

            const isFav = noteObject.favourite;

            // Skip if in "fav" tab and note is not a favourite
            if (currentTab === 'fav' && !isFav) continue;

            const template = `
              <div class="note" onclick="window.location.href='editor/assets/viewer.html?i=${i}'" style="--bg:${isFav ? '#ffe' : '#efe'};--b:${isFav ? '#aa6' : '#6f6'}">
                <h3>${noteObject.title}</h3>
                <p>By ${noteObject.preacher}</p>
                <p>${noteObject.date} • ${noteObject.location}</p>
                <p>
                  <button type="button" onclick="event.stopPropagation(); window.location.href='editor/index.html?i=${i}'">Edit</button>
                  <button type="button" onclick="event.stopPropagation(); toggleFavourite(${i})">${isFav ? 'Unfavourite' : 'Favourite'}</button>
                  <button type="button" onclick="event.stopPropagation(); dlt(${i})">Delete</button>
                </p>
              </div>`;
            
            main.innerHTML += template;
          }
        }
      }
    }

    function toggleFavourite(index) {
      const key = 'note' + index;
      let note = JSON.parse(localStorage.getItem(key));
      note.favourite = !note.favourite;
      localStorage.setItem(key, JSON.stringify(note));
      read();
    }

    function dlt(index) {
      const key = 'note' + index;
      let note = JSON.parse(localStorage.getItem(key));
      note.alive = 'deleted';
      localStorage.setItem(key, JSON.stringify(note));
      read();
    }

    allBtn.onclick = () => setTab('all');
    favBtn.onclick = () => setTab('fav');

    read();
  </script>
