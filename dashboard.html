<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <script type="text/javascript" src="apexcharts.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --primary: #2a72de;
      --accent: #ffd75e;
      --card-bg: #fff;
      --text: #333;
      --muted: #666;
      --radius: 14px;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 50px;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    header p {
      font-size: 0.9em;
      color: var(--muted);
    }

    header p span {
      display: block;
      font-weight: bold;
      font-size: 1.3em;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 0.85em;
      cursor: pointer;
      font-weight: 500;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-accent { background: var(--accent); color: #222; }

    .section {
      margin: 16px;
    }

    .section h2 {
      font-size: 1.2em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .notes-grid {
      display: grid;
      gap: 12px;
    }

    .note {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .note:hover {
      transform: translateY(-2px);
    }

    .note h3 {
      margin: 0 0 6px;
      font-size: 1.05em;
      color: var(--primary);
    }

    .note p {
      font-size: 0.85em;
      color: var(--muted);
      margin: 2px 0;
    }

    .empty-state {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      background: #fafafa;
      border-radius: var(--radius);
      font-size: 0.9em;
    }

    #chart {
      margin: 16px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <p> Praise God, <span id="nameD"></span></p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="window.location.href='/editor/index.html'">New Note</button>
      <button class="btn btn-accent" onclick="backupData()">Back Up</button>
      <button class="btn btn-primary" onclick="donate()">Donate</button>
    </div>
  </header>

  <div id="chart"></div>

  <div class="section">
    <h2>Recent Notes<span style="float: right; color: dodgerblue;font-size: 16px;" onclick="window.location.href='notes.html'">View All</span></h2>
    <div class="notes-grid" id="recentNotes"></div>
  </div>

  <div class="section">
    <h2>Favorites</h2>
    <div class="notes-grid" id="favNotes"></div>
  </div>

<script>
document.getElementById('nameD').innerHTML = JSON.parse(localStorage.getItem('user'))?.name || "Guest";

// ----- Graph -----
function getToday() {
  const today = new Date();
  return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
}

function graph(){
  const savedHabits = localStorage.getItem('habits');
  const habits = savedHabits ? JSON.parse(savedHabits) : [];
  let total = 0;
  for(let i=0;i<habits.length;i++){
    const p = habits[i].completions[getToday()] / habits[i].frequency;
    total+=p;
  }
  const averagePercentage = habits.length > 0 ? total*100/habits.length : 0;

  var options = {  
        series: [averagePercentage],  // Use the average percentage for the chart  
        chart: {  
            height: 260,  
            type: 'radialBar',  
            offsetY: 0  
        },  
        plotOptions: {  
            radialBar: {  
                startAngle: -135,  
                endAngle: 135,  
                dataLabels: {  
                    name: {  
                        fontSize: '12px',  
                        color: undefined,  
                        offsetY: 90  
                    },  
                    value: {  
                        offsetY: 46,  
                        fontSize: '34px',  
                        color: undefined,  
                        formatter: function (val) {  
                            return val.toFixed(0) + "%";  // Display with 2 decimal places  
                        }  
                    }  
                }  
            }  
        },  
        fill: {  
            type: 'gradient',  
            gradient: {  
                shade: 'dark',  
                shadeIntensity: 0.15,  
                inverseColors: false,  
                opacityFrom: 1,  
                opacityTo: 1,  
                stops: [0, 50, 65, 91]  
            }  
        },  
        stroke: {  
            dashArray: 4  
        },  
        labels: ['Habit Performance Today'],  
    };  
  
    var chart = new ApexCharts(document.querySelector("#chart"), options);  
    chart.render();  
}
graph();

// ----- Notes Loader -----
function loadNotes() {
  let stored = JSON.parse(localStorage.getItem("iosNotes")) || {};
  let notes = Object.keys(stored).map(id => {
    let note = stored[id];
    note.id = id;
    return note;
  }).filter(n => n.alive !== 'deleted');

  notes.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Recent
  const recent = notes.slice(0,5);
  const recentContainer = document.getElementById('recentNotes');
  recentContainer.innerHTML = '';
  if (recent.length === 0) {
    recentContainer.innerHTML = `<div class="empty-state">No notes yet. Click "New Note" to create one.</div>`;
  } else {
    recent.forEach(note => recentContainer.innerHTML += renderNoteCard(note));
  }

  // Favorites
  const favs = notes.filter(n => n.isFav).slice(0,2);
  const favContainer = document.getElementById('favNotes');
  favContainer.innerHTML = '';
  if (favs.length === 0) {
    favContainer.innerHTML = `<div class="empty-state">No favorites yet. Mark some notes as favorite!</div>`;
  } else {
    favs.forEach(note => favContainer.innerHTML += renderNoteCard(note));
  }
}

function renderNoteCard(note) {
  return `
    <div class="note" onclick="window.location.href='editor/assets/viewer.html?i=${note.id}'">
      <h3>${note.title}</h3>
      <p>By ${note.preacher || "Unknown"}</p>
      <p>${note.date ? new Date(note.date).toLocaleDateString() : ""} • ${note.location || "No location"}</p>
    </div>`;
}

function backupData() {
  const notes = localStorage.getItem("iosNotes") || "{}";
  const blob = new Blob([notes], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "notes-backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function donate() {
  alert("Thank you for considering donating 🙏. (Here you could redirect to PayPal/Stripe link)");
}

loadNotes();
</script>
</body>
</html>
