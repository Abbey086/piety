<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verse to Image Generator</title>

<!-- Google Fonts (10 fonts) -->
<link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display&family=Indie+Flower&family=Lobster&family=Montserrat&family=Pacifico&family=Open+Sans&family=Raleway&family=Merriweather&family=Oswald&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  body {
    font-family: sans-serif;
    padding: 0;
    background: #f0f0f0;
    text-align: center;
  }

  #verse-container {
    width: 360px;
    height: 360px;
    margin: auto;
    padding: 30px;
    color: white;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-sizing: border-box;
    user-select: none;
  }
.cp{
  position: absolute;
  bottom:15px;
}
  #verse-text {
    font-size: 1.5rem;
    line-height: 1.4;
    max-width: 90%;
  }

  #verse-ref {
    margin-top: 20px;
    font-weight: 700;
    font-size: 1.25rem;
    opacity: 0.85;
  }

  .bg-1 { background: linear-gradient(45deg, #667eea, #764ba2); }
  .bg-2 { background: linear-gradient(135deg, #ff9a9e, #fad0c4); color: #333; }
  .bg-3 { background: linear-gradient(45deg, #00c6ff, #0072ff); }
  .bg-4 { background: linear-gradient(60deg, #29323c, #485563); }
  .bg-5 { background: linear-gradient(45deg, #56ab2f, #a8e063); }
  .bg-6 { background-image:url("still-life-crucifix-with-beads.jpg");
  background-size: 100%;
  background-position: center;
  backdrop-filter: brightness(0);

  }
  .bg-7 { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); color: #333; }
  .bg-8 { background: linear-gradient(45deg, #fc5c7d, #6a82fb); }
  .bg-9 { background: radial-gradient(circle at center, #f9d423 0%, #ff4e50 100%); }
  .bg-10 { background: linear-gradient(45deg, #2c3e50, #4ca1af); }

  select, button {
    margin: 10px 8px;
    padding: 8px 14px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
    cursor: pointer;
  }
  button:hover {
    background-color: #ddd;
  }

</style>
</head>
<body>

  <h1>Verse to Image Generator</h1>

  <textarea id="verse-input" rows="4" cols="40" placeholder="Type your verse here...">For God so loved the world that He gave His only begotten Son...</textarea><br/>
  <input id="ref-input" type="text" placeholder="Reference (e.g. John 3:16)" value="John 3:16" style="width: 250px; padding: 8px; font-size: 1rem; margin: 10px auto; display: block; border-radius: 6px; border: 1px solid #ccc;" />

  <div>
    <label for="font-select">Font:</label>
    <select id="font-select" aria-label="Choose font">
      <option value="Roboto">Roboto</option>
      <option value="Playfair Display">Playfair Display</option>
      <option value="Indie Flower">Indie Flower</option>
      <option value="Lobster">Lobster</option>
      <option value="Montserrat">Montserrat</option>
      <option value="Pacifico">Pacifico</option>
      <option value="Open Sans">Open Sans</option>
      <option value="Raleway">Raleway</option>
      <option value="Merriweather">Merriweather</option>
      <option value="Oswald">Oswald</option>
    </select>

    <label for="background-select">Background:</label>
    <select id="background-select" aria-label="Choose background">
      <option value="bg-1">Blue Purple</option>
      <option value="bg-2">Pink Pastel</option>
      <option value="bg-3">Blue Sky</option>
      <option value="bg-4">Dark Steel</option>
      <option value="bg-5">Green Fresh</option>
      <option value="bg-6">Cross</option>
      <option value="bg-7">Light Gray</option>
      <option value="bg-8">Pink Purple</option>
      <option value="bg-9">Yellow Red</option>
      <option value="bg-10">Teal Blue</option>
    </select>
  </div>

  <div id="verse-container" class="bg-1" style="font-family: 'Roboto', sans-serif;">
    <div id="verse-text">For God so loved the world that He gave His only begotten Son...</div>
    <div id="verse-ref">John 3:16</div>
    <div class="cp">Made from Piety Life App</div>
  </div>

  <button onclick="downloadAsImage()">Download as JPG</button>
  <button onclick="shareVerseImage()">Share as JPG</button>

<script>
  const verseContainer = document.getElementById('verse-container');
  const verseTextEl = document.getElementById('verse-text');
  const verseRefEl = document.getElementById('verse-ref');
  const fontSelect = document.getElementById('font-select');
  const bgSelect = document.getElementById('background-select');
  const verseInput = document.getElementById('verse-input');
  const refInput = document.getElementById('ref-input');

  // Update verse text live
  verseInput.addEventListener('input', () => {
    verseTextEl.textContent = verseInput.value || '';
  });
async function shareVerseImage() {
  try {
    const canvas = await html2canvas(document.getElementById('verse-container'), { backgroundColor: null, scale: 2 });
    
    // Convert canvas to blob (JPEG)
    canvas.toBlob(async (blob) => {
      if (!navigator.canShare || !navigator.canShare({ files: [new File([blob], 'verse.jpg', { type: blob.type })] })) {
        alert('Sharing not supported on this device/browser.');
        return;
      }

      const file = new File([blob], 'verse.jpg', { type: blob.type });
      try {
        await navigator.share({
          files: [file],
          title: 'Verse Image',
          text: 'Check out this verse image!',
        });
      } catch (err) {
        console.error('Share failed:', err);
      }
    }, 'image/jpeg', 0.95);

  } catch (err) {
    console.error('Error creating image for sharing:', err);
  }
}

  // Update reference live
  refInput.addEventListener('input', () => {
    verseRefEl.textContent = refInput.value || '';
  });

  // Change font
  fontSelect.addEventListener('change', () => {
    verseContainer.style.fontFamily = `'${fontSelect.value}', sans-serif`;
  });

  // Change background
  bgSelect.addEventListener('change', () => {
    verseContainer.className = ''; // clear classes
    verseContainer.classList.add(bgSelect.value);
  });

  // Download function using html2canvas
  function downloadAsImage() {
    html2canvas(verseContainer, {backgroundColor: null, scale: 2}).then(canvas => {
      // Convert to JPEG (white background)
      const jpegCanvas = document.createElement('canvas');
      jpegCanvas.width = canvas.width;
      jpegCanvas.height = canvas.height;
      const ctx = jpegCanvas.getContext('2d');

      // Fill white background (optional)
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, jpegCanvas.width, jpegCanvas.height);

      // Draw original canvas on top
      ctx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'verse-image.jpg';
      link.href = jpegCanvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  }
</script>

</body>
</html>
