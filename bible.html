    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    .menu-enter {
      opacity: 0;
      transform: translateY(10px);
    }
    .menu-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 200ms ease-out, transform 200ms ease-out;
    }
    .menu-exit {
      opacity: 1;
      transform: translateY(0);
    }
    .menu-exit-active {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 200ms ease-out, transform 200ms ease-out;
    }
    
    .slide-in {
      animation: slideIn 0.3s ease-out forwards;
    }
    
    .slide-out {
      animation: slideOut 0.3s ease-out forwards;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    @keyframes slideOut {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(100%);
        opacity: 0;
      }
    }

  <script>
    // Initialize the app
    document.addEventListener('DOMContentLoaded', function() {
      // Simulate loading
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
        loadBooks();
        updateFavoriteCount();
      }, 800);
    });

    // Global variables to track current verse selection
    let currentVerseElement = null;
    let currentVerseData = {
      bookId: null,
      chapter: null,
      verseNum: null,
      text: '',
      reference: '',
      isFavorite: false
    };

    // Book loading and navigation
    function loadBooks() {
      const booksContainer = document.getElementById('books-container');
      booksContainer.innerHTML = '';
      
      for (let i = 0; i < 66; i++) {
        const book = bible[i];
        const bookElement = document.createElement('div');
        bookElement.className = 'py-3';
        bookElement.innerHTML = `
          <button onclick="loadChapters(${i})" class="w-full text-left flex justify-between items-center">
            <span class="text-gray-900">${book.name}</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>
          </button>
        `;
        booksContainer.appendChild(bookElement);
      }
    }

    function loadChapters(bookId) {
      const book = bible[bookId];
      const chaptersPanel = document.getElementById('chapters-panel');
      const chaptersTitle = document.getElementById('chapters-title');
      const chaptersContainer = document.getElementById('chapters-container');
      
      chaptersTitle.textContent = book.name;
      chaptersContainer.innerHTML = '';
      
      // Calculate how many chapters to show per row (max 5)
      const chapterCount = book.chapters.length;
      
      for (let i = 1; i <= chapterCount; i++) {
        const chapterElement = document.createElement('div');
        chapterElement.className = 'flex justify-center';
        chapterElement.innerHTML = `
          <button onclick="loadVerses(${bookId}, ${i})" class="w-12 h-12 flex items-center justify-center rounded-full bg-blue-50 text-blue-600 font-medium hover:bg-blue-100 transition-colors">
            ${i}
          </button>
        `;
        chaptersContainer.appendChild(chapterElement);
      }
      
      chaptersPanel.classList.remove('hidden');
      chaptersPanel.classList.add('slide-in');
    }

    function hideChaptersPanel() {
      const chaptersPanel = document.getElementById('chapters-panel');
      chaptersPanel.classList.add('slide-out');
      setTimeout(() => {
        chaptersPanel.classList.add('hidden');
        chaptersPanel.classList.remove('slide-in', 'slide-out');
      }, 300);
    }


    function hideVersesPanel() {
      const versesPanel = document.getElementById('verses-panel');
      versesPanel.classList.add('slide-out');
      setTimeout(() => {
        versesPanel.classList.add('hidden');
        versesPanel.classList.remove('slide-in', 'slide-out');
      }, 300);
    }

    function nextChapter() {
      const currentTitle = document.getElementById('verses-title').textContent;
      const parts = currentTitle.split(' ');
      const bookName = parts.slice(0, -1).join(' ');
      const currentChapter = parseInt(parts[parts.length - 1]);
      
      // Find the book index
      let bookId = -1;
      for (let i = 0; i < bible.length; i++) {
        if (bible[i].name === bookName) {
          bookId = i;
          break;
        }
      }
      
      if (bookId === -1) return;
      
      const nextChapter = currentChapter + 1;
      if (nextChapter <= bible[bookId].chapters.length) {
        loadVerses(bookId, nextChapter);
      } else {
        showToast('Last chapter in this book');
      }
    }

    function previousChapter() {
      const currentTitle = document.getElementById('verses-title').textContent;
      const parts = currentTitle.split(' ');
      const bookName = parts.slice(0, -1).join(' ');
      const currentChapter = parseInt(parts[parts.length - 1]);
      
      // Find the book index
      let bookId = -1;
      for (let i = 0; i < bible.length; i++) {
        if (bible[i].name === bookName) {
          bookId = i;
          break;
        }
      }
      
      if (bookId === -1) return;
      
      const prevChapter = currentChapter - 1;
      if (prevChapter >= 1) {
        loadVerses(bookId, prevChapter);
      } else {
        showToast('First chapter in this book');
      }
    }

    // Verse Menu Functions
    function showVerseMenu(bookId, chapter, verseNum, text, reference) {
      currentVerseData = {
        bookId,
        chapter,
        verseNum,
        text,
        reference,
        isFavorite: isFavorite(reference)
      };
      
      const menu = document.getElementById('verse-menu');
      const overlay = document.getElementById('verse-menu-overlay');
      const menuTitle = document.getElementById('verse-menu-title');
      const favoriteIcon = document.getElementById('favorite-icon');
      const favoriteText = document.getElementById('favorite-text');
      
      menuTitle.textContent = `${bible[bookId].name} ${chapter}:${verseNum}`;
      
      if (currentVerseData.isFavorite) {
        favoriteIcon.classList.remove('text-gray-500');
        favoriteIcon.classList.add('text-red-500');
        favoriteIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" fill="currentColor" />';
        favoriteText.textContent = 'Remove Favorite';
      } else {
        favoriteIcon.classList.remove('text-red-500');
        favoriteIcon.classList.add('text-gray-500');
        favoriteIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />';
        favoriteText.textContent = 'Add to Favorites';
      }
      
      overlay.classList.remove('hidden');
      menu.classList.remove('translate-y-full');
      setTimeout(() => {
        menu.classList.add('translate-y-0');
      }, 10);
    }

    function hideVerseMenu() {
      const menu = document.getElementById('verse-menu');
      const overlay = document.getElementById('verse-menu-overlay');
      
      menu.classList.remove('translate-y-0');
      setTimeout(() => {

function loadVerses(bookId, chapter) {
    const versesPanel = document.getElementById('verses-panel');
    const versesTitle = document.getElementById('verses-title');
    const versesContainer = document.getElementById('verses-container');

    const book = bible[bookId];
    if (!book || !book.chapters[chapter - 1]) {
        console.error('Invalid bookId or chapter');
        return;
    }

    const bookName = book.name;
    const chapterVerses = book.chapters[chapter - 1];

    versesTitle.textContent = `${bookName} ${chapter}`;
    versesContainer.innerHTML = '';

    for (let i = 0; i < chapterVerses.length; i++) {
        const verseNum = i + 1;
        const verseText = chapterVerses[i];
        const verseReference = `${bookName} ${chapter}:${verseNum}`;

        // Create verse container
        const verseElement = document.createElement('div');
        verseElement.className = 'py-3';

        // Create clickable verse line
        const verseLine = document.createElement('p');
        verseLine.className = 'flex';

        const numSpan = document.createElement('span');
        numSpan.className = 'text-xs text-gray-500 font-medium mr-2';
        numSpan.textContent = verseNum;

        const textSpan = document.createElement('span');
        textSpan.className = 'text-gray-900';
        textSpan.textContent = verseText;

        verseLine.appendChild(numSpan);
        verseLine.appendChild(textSpan);

        // Add event listener instead of inline onclick
        verseLine.addEventListener('click', () => {
            showVerseMenu(bookId, chapter, verseNum, verseText, verseReference);
        });

        verseElement.appendChild(verseLine);
        versesContainer.appendChild(verseElement);
    }

    // Slide in panel
    versesPanel.classList.remove('hidden');

    // Delay to allow CSS animation to trigger
    requestAnimationFrame(() => {
        versesPanel.classList.add('slide-in');

    function addFavorite(reference, text) {
      const favorites = JSON.parse(localStorage.getItem('bible-favorites') || '[]');
      favorites.push({ reference, text });
      localStorage.setItem('bible-favorites', JSON.stringify(favorites));
    }

    function removeFavorite(reference) {
      let favorites = JSON.parse(localStorage.getItem('bible-favorites') || '[]');
      favorites = favorites.filter(fav => fav.reference !== reference);
      localStorage.setItem('bible-favorites', JSON.stringify(favorites));
    }

    function isFavorite(reference) {
      const favorites = JSON.parse(localStorage.getItem('bible-favorites') || '[]');
      return favorites.some(fav => fav.reference === reference);
    }

    function updateFavoriteCount() {
      const favorites = JSON.parse(localStorage.getItem('bible-favorites') || '[]');
      document.getElementById('fav-count').textContent = favorites.length;
    }

    function copyVerse() {
      hideVerseMenu();
      const { reference, text } = currentVerseData;
      const textToCopy = `${text} - ${reference}`;
      
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast('Copied to clipboard');
      }).catch(err => {
        console.error('Could not copy text: ', err);
        // Fallback for browsers that don't support Clipboard API
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Copied to clipboard');
      });
    }

async function shareVerseImage() {
  try {
    const canvas = await html2canvas(document.getElementById('verse-container'), { backgroundColor: null, scale: 2 });
    
    // Convert canvas to blob (JPEG)
    canvas.toBlob(async (blob) => {
      if (!navigator.canShare || !navigator.canShare({ files: [new File([blob], 'verse.jpg', { type: blob.type })] })) {
        alert('Sharing not supported on this device/browser.');
        return;
      }

      const file = new File([blob], 'verse.jpg', { type: blob.type });
      try {
        await navigator.share({
          files: [file],
          title: 'Verse Image',
          text: 'Check out this verse image!',
        });
      } catch (err) {
        console.error('Share failed:', err);
      }
    }, 'image/jpeg', 0.95);

  } catch (err) {
    console.error('Error creating image for sharing:', err);
  }
}

  bgSelect.addEventListener('change', () => {

  // Download function using html2canvas
  function downloadAsImage() {
    html2canvas(verseContainer, {backgroundColor: null, scale: 2}).then(canvas => {
      // Convert to JPEG (white background)
      const jpegCanvas = document.createElement('canvas');
      jpegCanvas.width = canvas.width;
      jpegCanvas.height = canvas.height;
      const ctx = jpegCanvas.getContext('2d');

      // Fill white background (optional)
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, jpegCanvas.width, jpegCanvas.height);

      // Draw original canvas on top
      ctx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'verse-image.jpg';
      link.href = jpegCanvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  }
